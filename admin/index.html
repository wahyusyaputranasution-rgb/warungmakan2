<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin | Warung Makan</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/admin.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17181C">
<link rel="apple-touch-icon" href="../assets/images/icon-192.png">
</head>
<body>

<div id="loading-screen"><div class="loader-spinner"></div></div>
<div id="toast-container"></div>

<div class="login-page">
  <div class="login-box">
    <div class="brand-center">
      <img src="../assets/images/logo-placeholder.svg" alt="Logo">
      <h1>Dashboard Admin</h1>
      <p>Masuk untuk mengelola Warung Makan Anda</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
      </div>
      <p class="form-error" id="login-error" style="display:none;margin-bottom:12px"></p>
      <button type="submit" class="btn btn-primary btn-block" id="btn-submit-login">Masuk</button>
    </form>

    <p class="form-hint text-center mt-3" style="text-align:center;margin-top:16px">
      Login pertama? Gunakan <strong>admin</strong> / <strong>admin123</strong>, lalu segera ganti password.
    </p>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script>
function hideLoadingScreen() {
  const el = document.getElementById("loading-screen");
  if (el) setTimeout(() => el.classList.add("hidden"), 200);
}
function showToast(message, type = "info", duration = 3000) {
  let container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = "0"; setTimeout(() => toast.remove(), 300); }, duration);
}

// Jika sudah login, langsung arahkan ke dashboard
if (getToken()) {
  AdminApi.me().then(() => { window.location.href = "dashboard.html"; }).catch(() => clearToken());
}

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn-submit-login");
  const errorEl = document.getElementById("login-error");
  errorEl.style.display = "none";

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  btn.disabled = true;
  btn.textContent = "Memproses...";

  try {
    const result = await AdminApi.login(username, password);
    setToken(result.token);
    setAdminInfo(result.admin);
    window.location.href = "dashboard.html";
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = "block";
    btn.disabled = false;
    btn.textContent = "Masuk";
  }
});

hideLoadingScreen();
</script>
</body>
</html>
