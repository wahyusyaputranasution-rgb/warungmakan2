<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kategori | Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="loading-screen"><div class="loader-spinner"></div></div>
<div id="toast-container"></div>

<div id="admin-root"></div>
<div id="admin-page-content-source" style="display:none">
  <div class="panel">
    <div class="panel-header">
      <h3>Daftar Kategori</h3>
      <button class="btn btn-primary" onclick="openCreateModal()">+ Tambah Kategori</button>
    </div>
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr><th>Urutan</th><th>Nama</th><th>Slug</th><th>Status</th><th></th></tr></thead>
        <tbody id="kategori-body"><tr><td colspan="5">Memuat...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-form">
  <div class="modal-box" style="max-width:420px">
    <div class="modal-header"><h3 id="modal-title">Tambah Kategori</h3><button class="modal-close" data-close-modal="modal-form">&times;</button></div>
    <form id="kategori-form">
      <input type="hidden" id="kategori-id">
      <div class="form-group"><label>Nama Kategori *</label><input type="text" id="kategori-nama" class="form-control" required maxlength="100"></div>
      <div class="form-group"><label>Urutan Tampil</label><input type="number" id="kategori-urutan" class="form-control" value="0"></div>
      <div class="form-group"><label class="form-check"><input type="checkbox" id="kategori-aktif" checked> Tampilkan di website</label></div>
      <button type="submit" class="btn btn-primary btn-block mt-2" id="btn-save">Simpan</button>
    </form>
  </div>
</div>

<script src="../assets/js/admin-api.js"></script>
<script src="../assets/js/admin-layout.js"></script>
<script>
(async function init() {
  const ok = await requireAuthGuard();
  if (!ok) { window.location.href = "../index.html"; return; }
  renderAdminLayout("kategori", "Kelola Kategori");
  hideLoadingScreen();
  loadKategori();
})();

async function loadKategori() {
  const tbody = document.getElementById("kategori-body");
  tbody.innerHTML = `<tr><td colspan="5">Memuat...</td></tr>`;
  try {
    const list = await AdminApi.listCategories();
    if (!list.length) { tbody.innerHTML = `<tr><td colspan="5" class="text-muted text-center">Belum ada kategori.</td></tr>`; return; }
    tbody.innerHTML = list.map((k) => `
      <tr>
        <td>${k.urutan}</td>
        <td class="fw-bold">${k.nama}</td>
        <td>${k.slug}</td>
        <td><span class="pill ${k.aktif ? "green" : "gray"}">${k.aktif ? "Aktif" : "Nonaktif"}</span></td>
        <td>
          <div class="action-btns">
            <button class="btn btn-sm btn-outline" onclick='openEditModal(${JSON.stringify(k).replace(/'/g, "&apos;")})'>Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteKategori(${k.id})">Hapus</button>
          </div>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" class="text-muted">${err.message}</td></tr>`;
  }
}

function resetForm() { document.getElementById("kategori-form").reset(); document.getElementById("kategori-id").value = ""; document.getElementById("kategori-aktif").checked = true; }
function openCreateModal() { resetForm(); document.getElementById("modal-title").textContent = "Tambah Kategori"; openModal("modal-form"); }
function openEditModal(k) {
  resetForm();
  document.getElementById("modal-title").textContent = "Edit Kategori";
  document.getElementById("kategori-id").value = k.id;
  document.getElementById("kategori-nama").value = k.nama;
  document.getElementById("kategori-urutan").value = k.urutan;
  document.getElementById("kategori-aktif").checked = !!k.aktif;
  openModal("modal-form");
}

document.getElementById("kategori-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const id = document.getElementById("kategori-id").value;
  const payload = {
    nama: document.getElementById("kategori-nama").value.trim(),
    urutan: parseInt(document.getElementById("kategori-urutan").value) || 0,
    aktif: document.getElementById("kategori-aktif").checked,
  };
  try {
    if (id) await AdminApi.updateCategory(id, payload);
    else await AdminApi.createCategory(payload);
    showToast("Kategori berhasil disimpan.", "success");
    closeModal("modal-form");
    loadKategori();
  } catch (err) {
    showToast(err.message, "error");
  }
});

async function deleteKategori(id) {
  if (!confirmAction("Yakin ingin menghapus kategori ini?")) return;
  try {
    await AdminApi.deleteCategory(id);
    showToast("Kategori dihapus.", "success");
    loadKategori();
  } catch (err) {
    showToast(err.message, "error");
  }
}
</script>
</body>
</html>
