<script>
document.getElementById("tahun-sekarang").textContent = new Date().getFullYear();

async function loadMapWarung() {
  try {
    const settings = await Api.getSettings();
    const map = L.map("map").setView([settings.latitude, settings.longitude], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);
    L.marker([settings.latitude, settings.longitude]).addTo(map).bindPopup(settings.nama_warung).openPopup();
    setTimeout(() => map.invalidateSize(), 200);
  } catch (err) {
    document.getElementById("map").innerHTML = `<p class="text-muted text-center" style="padding:40px 0">Peta tidak dapat dimuat.</p>`;
  }
}
loadMapWarung();
</script>
