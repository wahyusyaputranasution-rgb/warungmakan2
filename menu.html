<script src="assets/js/api.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/main.js"></script>
<script>
document.getElementById("tahun-sekarang").textContent = new Date().getFullYear();

const urlParams = new URLSearchParams(window.location.search);
let currentKategori = urlParams.get("kategori") || "";
let currentSearch = "";
let currentBestSeller = urlParams.get("best_seller") || "";
let searchDebounce;

function renderProdukCard(p) {
  const diskon = p.harga_coret > p.harga && p.harga_coret > 0;
  const habis = p.status === "habis" || p.stok <= 0;
  return `
    <div class="produk-card">
      <a href="detail-produk.html?slug=${p.slug}">
        <div class="foto-wrap">
          <img src="${p.foto_url || "assets/images/produk-placeholder.svg"}" alt="${p.nama}" loading="lazy">
          <div class="produk-badges">
            ${p.best_seller ? `<span class="badge best">Best Seller</span>` : ""}
            ${p.produk_baru ? `<span class="badge baru">Baru</span>` : ""}
            ${diskon ? `<span class="badge diskon">-${p.diskon_persen}%</span>` : ""}
            ${habis ? `<span class="badge habis">Habis</span>` : ""}
          </div>
        </div>
        <div class="produk-info">
          <h3>${p.nama}</h3>
          <div class="harga-row">
            <span class="harga-sekarang">${formatRupiah(p.harga)}</span>
            ${diskon ? `<span class="harga-coret">${formatRupiah(p.harga_coret)}</span>` : ""}
          </div>
          <div class="produk-meta">⏱ ${p.estimasi_masak_menit} menit</div>
        </div>
      </a>
      <button class="btn-add-cart" data-id="${p.id}" ${habis ? "disabled" : ""} aria-label="Tambah ke keranjang">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
  `;
}

function attachAddToCartHandlers(produkList) {
  document.querySelectorAll(".btn-add-cart").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const id = parseInt(btn.dataset.id);
      const produk = produkList.find((p) => p.id === id);
      if (!produk) return;
      Cart.addItem(produk, 1);
      showToast(`${produk.nama} ditambahkan ke keranjang`, "success");
    });
  });
}

async function loadKategoriFilter() {
  const el = document.getElementById("kategori-filter");
  try {
    const kategori = await Api.getCategories();
    kategori.forEach((k) => {
      const btn = document.createElement("button");
      btn.className = "kategori-item" + (currentKategori === k.slug ? " active" : "");
      btn.dataset.slug = k.slug;
      btn.innerHTML = `<div class="icon-circle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg></div><span>${k.nama}</span>`;
      el.appendChild(btn);
    });
    if (currentKategori) {
      document.querySelectorAll(".kategori-item").forEach((b) => b.classList.toggle("active", b.dataset.slug === currentKategori));
    }
    el.addEventListener("click", (e) => {
      const btn = e.target.closest(".kategori-item");
      if (!btn) return;
      currentKategori = btn.dataset.slug;
      document.querySelectorAll(".kategori-item").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      loadProduk();
    });
  } catch (err) {
    console.error(err);
  }
}

async function loadProduk() {
  const listEl = document.getElementById("produk-list");
  const emptyEl = document.getElementById("produk-empty");
  listEl.innerHTML = `<div class="skeleton" style="aspect-ratio:1/1.4"></div><div class="skeleton" style="aspect-ratio:1/1.4"></div><div class="skeleton" style="aspect-ratio:1/1.4"></div><div class="skeleton" style="aspect-ratio:1/1.4"></div>`;
  emptyEl.style.display = "none";

  try {
    const params = {};
    if (currentKategori) params.kategori = currentKategori;
    if (currentSearch) params.q = currentSearch;
    if (currentBestSeller) params.best_seller = currentBestSeller;

    const produk = await Api.getProducts(params);
    if (!produk.length) {
      listEl.innerHTML = "";
      emptyEl.style.display = "block";
      return;
    }
    listEl.innerHTML = produk.map(renderProdukCard).join("");
    attachAddToCartHandlers(produk);
  } catch (err) {
    listEl.innerHTML = `<p class="text-muted">Gagal memuat menu: ${err.message}</p>`;
  }
}

document.getElementById("search-input").addEventListener("input", (e) => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    currentSearch = e.target.value.trim();
    loadProduk();
  }, 400);
});

loadKategoriFilter();
loadProduk();
</script>
</body>
</html>
