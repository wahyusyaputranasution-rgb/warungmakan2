# ==========================================================
# WRANGLER CONFIG - WARUNG MAKAN API (Cloudflare Worker)
# ==========================================================
# File ini mengonfigurasi Worker backend (api/worker.js) yang di-deploy
# TERPISAH dari Cloudflare Pages (frontend statis).
#
# Alur deployment:
#   1. Deploy Worker ini terlebih dahulu -> menghasilkan URL seperti
#      https://warung-makan-api.<subdomain-anda>.workers.dev
#   2. Isi URL tersebut ke assets/js/api.js dan admin/assets/js/admin-api.js
#      pada variabel API_BASE_URL.
#   3. Deploy folder root project ini ke Cloudflare Pages (frontend statis).
#
# Lihat README.md untuk langkah lengkap.

name = "warung-makan-api"
main = "api/worker.js"
compatibility_date = "2024-09-23"

# ==========================================================
# D1 DATABASE BINDING
# ==========================================================
# Buat database dengan:
#   wrangler d1 create warung_makan_db
# Salin "database_id" yang muncul pada output ke bawah ini.
[[d1_databases]]
binding = "DB"
database_name = "warungmakandb"
database_id = "139f9932-b9b2-44d0-8d2f-6c6b57178b61"



# ==========================================================
# ENVIRONMENT VARIABLES
# ==========================================================
[vars]
# WAJIB DIGANTI sebelum deploy produksi — gunakan string acak yang panjang.
# Contoh membuat secret acak: openssl rand -hex 32
JWT_SECRET = "ganti_dengan_secret_key_yang_sangat_rahasia_dan_panjang_123456"
APP_ENV = "production"
